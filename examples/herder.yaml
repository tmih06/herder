server:
  listen: 127.0.0.1:8787

database:
  path: ~/.local/state/herder/herder.db

herdr:
  mode: socket

github:
  app_id: ${HERDER_GITHUB_APP_ID}
  private_key_file: ${HERDER_GITHUB_PRIVATE_KEY}

scheduler:
  max_workers: 4
  per_repository:
    tmih06/meltiply: 3
  per_agent:
    codex: 4
  lease_ttl: 2m
  dispatch_interval: 2s

repositories:
  tmih06/meltiply:
    enabled: true
    trigger:
      labels:
        - agent-ready
    agent:
      default: codex-default
    sandbox:
      provider: docker
    validation:
      commands:
        - go test ./...
      forbidden_changes:
        - ".github/workflows/**"
      require_clean_git: true
    delivery:
      create_pr: true
      auto_merge: false
      labels:
        running: agent-running
        review: agent-review
        completed: completed

agents:
  codex-default:
    kind: codex
    timeout: 2h
    resources:
      cpu: 2
      memory: 4Gi
