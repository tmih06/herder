name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22", stable]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      # Bare `go mod tidy` also walks the synced skill examples under
      # agent/, which are not part of this module's build; -e tolerates
      # that unrelated failure while still normalizing our requirements.
      # Pinned to the floor toolchain so no newer Go rewrites go.mod.
      - name: Check go mod tidy
        if: matrix.go == '1.22'
        run: |
          go mod tidy -e
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run tests
        run: go test -race -shuffle=on -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  cross:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # CGO_ENABLED=0 proves the binary stays single and self-contained:
      # the SQLite driver is pure Go, so no C toolchain is required.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "herder-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/herder
